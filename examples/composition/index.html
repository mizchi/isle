<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Isle のコンポーネント合成</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; color: #182b3b; background: #f3f6fa; font: 17px/1.6 system-ui, sans-serif; }
    body > header, body > section { max-width: 800px; margin: 0 auto; }
    h1 { font-size: clamp(22px, 4vw, 30px); line-height: 1.35; text-wrap: balance; }
    h2 { font-size: 24px; line-height: 1.4; margin: 0 0 16px; }
    h3 { font-size: 19px; margin: 0 0 12px; }
    body > section > h2 { font-size: 18px; margin-top: 32px; }
    .panel { margin: 20px 0; padding: 24px; background: #fff; border: 1px solid #b9cbd9; border-radius: 12px; }
    .children { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
    .counter { padding: 16px; border: 1px solid #b9cbd9; border-radius: 8px; }
    .value { display: flex; gap: 16px; align-items: baseline; margin: 12px 0; }
    output { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    button { min-height: 44px; min-width: 88px; padding: 8px 14px; font: inherit; color: white; background: #183f60; border: 1px solid #183f60; border-radius: 6px; cursor: pointer; }
    button:focus-visible { outline: 3px solid #a44f00; outline-offset: 4px; }
    @media (max-width: 540px) { .children { grid-template-columns: 1fr; } .panel { padding: 16px; } }
  </style>
</head>
<body>
  <header><h1>Isle のコンポーネント合成</h1><p>それぞれのボタンで、親と子の値を変更できます。</p></header>
  <!--isle:ssr-->
</body>
</html>
