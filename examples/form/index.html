<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form validation</title>
  <style>
    :root { font: 18px/1.5 system-ui, sans-serif; color: #182029; background: #fff; }
    body { margin: 24px; }
    main { max-width: 640px; margin: auto; }
    form { display: grid; gap: 12px; margin-bottom: 48px; }
    input, select, textarea, button { font: inherit; min-height: 44px; padding: 8px; border: 2px solid #576575; border-radius: 4px; box-sizing: border-box; max-width: 100%; }
    label { display: block; }
    label input[type=checkbox] { width: 28px; min-height: 28px; vertical-align: middle; }
    p { margin: 0; }
    p[aria-live] { min-height: 1.5em; color: #9b1c1c; }
    button { background: #172b4d; color: #fff; }
    input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid #1261a0; outline-offset: 3px; }
  </style>
</head>
<body><main>
  <h1>Form validation</h1>
  <!--isle:ssr-->
</main></body>
</html>
