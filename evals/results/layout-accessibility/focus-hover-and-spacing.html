<!doctype html><html lang="en"><head><meta charset="utf-8"><style>*{box-sizing:border-box;margin:0;padding:0}html,body{margin:0}.page{display:grid;grid-template-columns:200px;grid-template-rows:30px 30px 30px 30px 20px 24px;background:#fff;color:#000;font-family:sans-serif;font-size:16px;line-height:20px;}.b1,.b2,.b3,.b4{appearance:none;display:block;padding:0;border:0;min-width:0;min-height:0;background:transparent;color:inherit;font:inherit;inline-size:200px;block-size:30px;background:#fff;color:#000}.b2,.b3{outline:none}.b3:focus-visible{box-shadow:0 0 0 3px #1a73e8}.b4:hover{color:#bbb}.t1,.t2{display:block;font-family:"Noto Sans JP";font-size:16px;line-height:20px;font-weight:400;white-space:nowrap;overflow:hidden}</style></head><body><div class="page"><button class="b1">Plain</button><button class="b2">No ring</button><button class="b3">Shadow</button><button class="b4">Pale hover</button><p class="t1">Clipped line</p><p class="t2">Roomy line</p></div></body></html>
