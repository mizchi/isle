<!doctype html><html lang="en"><head><meta charset="utf-8"><style>*{box-sizing:border-box;margin:0;padding:0}html,body{margin:0}.page{display:grid;grid-template-columns:200px;grid-auto-rows:40px;row-gap:8px;background:#fff}.c,.h{display:grid;grid-template-columns:minmax(0,1fr);grid-auto-rows:auto}.c{overflow:clip}.h{overflow:hidden}.s{block-size:60px}.b1,.b2,.b3{appearance:none;display:block;padding:0;border:0;min-width:0;min-height:0;background:transparent;color:inherit;font:inherit;block-size:24px}</style></head><body><div class="page"><div class="c"><div class="s"></div><button class="b1" aria-label="Clipped"></button></div><div class="h"><div class="s"></div><button class="b2" aria-label="Scrolled"></button></div><div class="c"><button class="b3" aria-label="Inside"></button></div></div></body></html>
