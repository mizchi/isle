<!doctype html><html lang="en"><head><meta charset="utf-8"><style>*{box-sizing:border-box;margin:0;padding:0}html,body{margin:0}.page{display:grid;grid-template-columns:200px;grid-auto-rows:24px;background:#fff;color:#000;font-family:sans-serif;font-size:16px;line-height:20px;}.t1,.t2,.spin,.calm,.ghost{display:block}.spin,.calm{animation:spin 1s linear infinite}.ghost{animation:nothing 1s infinite}@keyframes spin{to{opacity:.5}}@media (prefers-reduced-motion: reduce){.calm{animation:none}}@media (prefers-color-scheme: dark){.page{background:#111;color:#eee}.t2{color:#555}}</style></head><body><div class="page"><p class="t1">Always readable</p><p class="t2">Pale in dark</p><div class="spin"></div><div class="calm"></div><div class="ghost"></div></div></body></html>
