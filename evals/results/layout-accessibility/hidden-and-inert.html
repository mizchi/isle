<!doctype html><html lang="en"><head><meta charset="utf-8"><style>*{box-sizing:border-box;margin:0;padding:0}html,body{margin:0}.page{display:grid;grid-template-columns:200px;grid-auto-rows:30px;background:#fff}.b1,.b2,.b3,.b4{appearance:none;padding:0;border:0;min-width:0;min-height:0;background:transparent}.b2,.b3,.b4{display:block}.shown{display:block}.w{display:grid;grid-template-columns:minmax(0,1fr)}.b5{display:block}</style></head><body><div class="page"><button class="b1" hidden></button><button class="b2 shown" hidden></button><div class="w" inert><button class="b3"></button></div><button class="b4" aria-label="Go" popovertarget="m"></button><div class="m" id="m" popover><button class="b5"></button></div></div></body></html>
