<!doctype html><html lang="en"><head><meta charset="utf-8"><style>*{box-sizing:border-box;margin:0;padding:0}html,body{margin:0}.bar{display:grid;grid-template-columns:40px 40px minmax(0,1fr);grid-template-rows:40px;background:#fff;color:#000;pointer-events:none;font-family:sans-serif;font-size:16px;line-height:20px;}.b1,.b2{appearance:none;display:block;padding:0;border:0;min-width:0;min-height:0;background:transparent;color:inherit;font:inherit;}.b2{pointer-events:auto}.fine{font-size:11px}@media (width >= 900px){.fine{font-size:14px}}</style></head><body><main class="bar"><button class="b1" aria-label="A"></button><button class="b2" aria-label="B"></button><p class="fine">Fine print</p></main></body></html>
