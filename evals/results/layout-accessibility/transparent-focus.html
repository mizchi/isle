<!doctype html><html lang="en"><head><meta charset="utf-8"><style>*{box-sizing:border-box;margin:0;padding:0}html,body{margin:0}.page{display:grid;grid-template-columns:200px;grid-auto-rows:30px;background:#fff}.c1,.c2,.b{appearance:none;display:block;padding:0;border:0;min-width:0;min-height:0;background:transparent;color:inherit;font:inherit;inline-size:30px;block-size:30px}.c1{opacity:0}.c2{opacity:0}.c2:focus{opacity:1}.w{display:grid;grid-template-columns:minmax(0,1fr);opacity:0}</style></head><body><div class="page"><input class="c1" type="checkbox" aria-label="A"><input class="c2" type="checkbox" aria-label="B"><div class="w"><button class="b" aria-label="C"></button></div></div></body></html>
