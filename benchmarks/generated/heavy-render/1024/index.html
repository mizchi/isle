<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>発注計画 — 1,024商品</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px 20px; color: #172f43; background: #eef3f8; font: 16px/1.6 system-ui, sans-serif; }
    body > header, body > section { max-width: 1100px; margin: 0 auto; }
    h1 { margin: 0 0 12px; font-size: clamp(25px, 4vw, 36px); line-height: 1.35; }
    h2 { margin: 24px 0 16px; font-size: 21px; }
    h3 { margin: 0; font-size: 18px; }
    p { margin: 8px 0 16px; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; margin: 20px 0; }
    a { color: #174e7c; text-underline-offset: 4px; }
    nav a { padding: 8px 12px; background: white; border: 1px solid #8ba5ba; border-radius: 6px; }
    nav a[aria-current] { color: white; background: #174768; border-color: #174768; }
    .workspace { display: grid; gap: 20px; }
    .surface { background: white; border: 1px solid #b7c8d6; border-radius: 10px; }
    .audit, .sheet-header { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; padding: 20px; }
    .audit p, .sheet-header p { margin-bottom: 0; }
    .products { margin: 0; padding: 0; list-style: none; }
    .product-row { display: grid; grid-template-columns: 1.2fr repeat(4, 1fr); gap: 16px; padding: 14px 20px; border-top: 1px solid #cedbe5; }
    .product-row:nth-child(even) { background: #f5f8fb; }
    .cell { display: flex; flex-direction: column; min-width: 0; font-variant-numeric: tabular-nums; }
    .label { color: #465d70; font-size: 13px; }
    button { min-height: 44px; padding: 10px 16px; border: 1px solid #174768; border-radius: 6px; color: white; background: #174768; font: inherit; cursor: pointer; }
    button:hover { background: #123951; }
    button:focus-visible, a:focus-visible { outline: 3px solid #a14d00; outline-offset: 4px; }
    @media (max-width: 640px) {
      body { padding: 20px 16px; }
      .product-row { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; padding: 16px; }
      .sku { grid-column: 1 / -1; }
      .audit, .sheet-header { padding: 16px; }
      .sheet-header button { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>発注計画の一括調整</h1>
    <p>4,096商品のうち1,024商品を表示しています。操作は表示中の商品が対象です。</p>
    <nav aria-label="表示件数"><a href="/heavy-render/128/">128商品</a><a href="/heavy-render/1024/" aria-current="page">1,024商品</a><a href="/heavy-render/4096/">4,096商品</a></nav>
  </header>
  <!--isle:ssr-->
</body>
</html>
