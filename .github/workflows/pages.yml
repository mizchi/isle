name: Deploy documentation and demos

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Hosted runner for build and publication
        type: choice
        default: macos-latest
        options:
          - macos-latest
          - ubuntu-latest

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install MoonBit
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/install-moonbit.sh" https://cli.moonbitlang.com/install/unix.sh
          bash "$RUNNER_TEMP/install-moonbit.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: moon update
      - run: pnpm build:compiler
      - run: node --test tests/site.test.mjs tests/links.test.mjs tests/browser-compiler.test.mjs tests/preview.test.mjs tests/control-components.test.mjs tests/removed-control-syntax.test.mjs tests/event-declarations.test.mjs tests/event-policy-build.test.mjs tests/lexical-events*.test.mjs tests/inline-css*.test.mjs tests/layout-z3.test.mjs tests/layout-shorthand.test.mjs tests/css-writes.test.mjs tests/resume-semantics-audit.test.mjs tests/layout-variables.test.mjs tests/layout-contract.test.mjs tests/layout-syntax*.test.mjs tests/layout-declaration-build.test.mjs tests/playground-editor.test.mjs
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Build static site and examples
        run: node tools/build-site.mjs
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
      - run: node tools/check-site.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Check browser compilation and sandboxed preview
        run: pnpm exec playwright test --config playwright.playground.config.mjs
      - name: Check lexical parent event projection
        run: |
          node tools/write-lexical-guide.mjs --check
          pnpm exec playwright test --config playwright.lexical-events.config.mjs
      - name: Check live examples on the project subpath
        run: pnpm exec playwright test --config playwright.site.config.mjs
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist/site
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
