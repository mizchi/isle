name: Deploy documentation and demos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: hustcer/setup-moonbit@v1.25
      - run: pnpm install --frozen-lockfile
      - run: moon update
      - run: pnpm build:compiler
      - run: node --test tests/site.test.mjs tests/links.test.mjs
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Build static site and examples
        run: node tools/build-site.mjs
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
      - run: node tools/check-site.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Check live examples on the project subpath
        run: pnpm exec playwright test --config playwright.site.config.mjs
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
